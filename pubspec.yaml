name: nutrizham
description: A comprehensive fitness nutrition app with meal planning

publish_to: "none"

version: 1.1.1+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  google_sign_in: 7.2.0
  crypto: ^3.0.3
  url_launcher: ^6.1.10
  go_router: ^14.2.0
  flutter_bloc: ^9.1.0
  provider: ^6.1.2
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.1

flutter_native_splash:
  color: "#F28C6B"
  image: assets/logo/app_logo.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo/app_logo.png
  fonts:
    - family: Rudaw
      fonts:
        - asset: assets/fonts/rudaw.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/logo/app_logo.png"
  image_path_ios: "assets/logo/app_logo.png"
  adaptive_icon_background: "#F28C6B"
  adaptive_icon_foreground: "assets/logo/app_logo.png"
  remove_alpha_ios: true
